[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "credit-decision-support"
version = "0.4.0"
description = "Auditable credit analysis with synthetic data and human review"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "python-multipart>=0.0.20,<1", "pypdf>=6,<8",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "openapi-spec-validator>=0.7,<1", "pyyaml>=6,<7", "reportlab>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/credit_support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/credit_support"]
