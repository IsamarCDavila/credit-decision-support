name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: credit_support_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d credit_support_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      CDS_TEST_ADMIN_URL: postgresql+psycopg://postgres@127.0.0.1:5432/credit_support_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- contracts/openapi.json
      - run: uv run python scripts/configure_demo.py
      - run: docker compose config --quiet
      - run: docker compose up --build --wait api worker
      - run: curl --fail http://127.0.0.1:8000/readyz
      - if: always()
        run: docker compose down
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
